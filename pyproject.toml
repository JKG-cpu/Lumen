[project]
name = "lumen"
version = "0.1.0"
description = "A game where you bounce light around mirrors, because pixl is in a blackout..."
readme = "README.md"
authors = [
    { name = "JKG-cpu", email = "jkg66512@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
lumen = "lumen:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
